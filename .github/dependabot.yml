version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; offering 7.x
      # made every dev-tooling update fail to resolve its peer dependency.
      # Move TypeScript to a new major by hand, together with typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must describe the Node versions the project runs on (22 and 24);
      # newer majors describe APIs those versions lack.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action's init and analyze steps must run the same version, so
      # they are bumped in one pull request instead of two that each fail alone.
      codeql-action:
        patterns:
          - "github/codeql-action*"
