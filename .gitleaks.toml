  # Placeholder workspace and channel ids.
  '''/T0{8}/B0{8}/''',
]

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Made-up values in tests"
condition = "AND"
paths = [
  '''\.test\.tsx?$''',
  '''^apps/server/src/testing/''',
  '''^apps/server/src/modules/[^/]+/testing/''',
  '''^apps/server/test/''',
  '''^tests/''',
  '''^scripts/gitleaks-canary\.sh$''',
]
regexTarget = "secret"
regexes = [
  # The textbook payload {"sub":"1234567890"}, or a signature that is the
  # word "signature".
  '''^eyJ[A-Za-z0-9_-]+\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''',
  '''\.c2lnbmF0dXJl[A-Za-z0-9_-]*$''',
]

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Made-up values in tests"
condition = "AND"
paths = [
  '''\.test\.tsx?$''',
  '''^apps/server/src/testing/''',
  '''^apps/server/src/modules/[^/]+/testing/''',
  '''^apps/server/test/''',
  '''^tests/''',
  '''^scripts/gitleaks-canary\.sh$''',
]
regexTarget = "secret"
regexes = [
  # A block shorter than any real key (RSA and Ed25519 keys run to several
  # hundred characters at least).
  '''^-----BEGIN[A-Z ]*PRIVATE KEY-----[\s\S]{0,170}$''',
]
